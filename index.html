 const oth=T.filter(t=>t.n!=ME).map(t=>[t.n,"أ/ "+t.n]);if(!F.to)F.to=oth[0][0];
 return `<div class="card"><b>إرسال زيارة / تذكير / رسالة</b><div class="fm">${sel("kind",[["visit","زيارة"],["rem","تذكير"],["msg","رسالة"]])}${sel("to",[...oth,["all","كل المعلمين"]])}${sel("day",[["-1","بدون يوم"],...DAYS.map((d,i)=>[i,d])])}${sel("period",[["0","بدون حصة"],...[1,2,3,4,5,6,7].map(i=>[i,"الحصة "+i])])}</div>
 <textarea id="tx" rows="2" placeholder="نص الملاحظة (اختياري)" oninput="F.text=this.value">${esc(F.text)}</textarea>
 <button class="on" onclick="sendNote()">إرسال</button> <button onclick="copyNote()">نسخ كرسالة</button><div class="mu" id="ns" style="margin-top:6px"></div></div><div class="card" id="nl"></div>`;
}
const nst=t=>{const e=$("ns");if(e)e.textContent=t};
function cur(){return {from:ME,to:F.to,kind:F.kind,day:+F.day,period:+F.period,text:F.text.trim(),ts:Date.now()}}
async function sendNote(){
 const n=cur();
 if(n.kind=="visit"&&(n.day<0||!n.period)){nst("حدد اليوم والحصة للزيارة");return}
 if(!DBN){nst("الإرسال المباشر غير متاح هنا، استخدم زر النسخ");return}
 try{await DBN.collection("notes").add(n);F.text="";const t=$("tx");if(t)t.value="";nst("تم الإرسال ✓")}
 catch(e){nst(e&&e.code=="invalid_argument"?"صلاحيتك لا تسمح بالإرسال، اطلب من صاحب الصفحة يعطيك صلاحية مساهم، أو استخدم النسخ":"تعذر الإرسال")}
}
function copyNote(){const x=ntxt(cur());try{navigator.clipboard.writeText(x).then(()=>nst("تم النسخ: "+x),()=>nst(x))}catch(e){nst(x)}}
function delNote(id){try{DBN.collection("notes").doc(id).delete()}catch(e){}}
function renderNotes(){const el=$("nl");if(!el)return;
 const m=NOTES.filter(n=>n.to==ME||n.to=="all"||n.from==ME);
 el.innerHTML="<b>الوارد والصادر</b>"+(m.length?m.map(n=>`<div class="row"><span><span class="c ${n.from==ME?"g11":"g10"}">${n.from==ME?"أرسلت":"وارد"}</span> ${esc(ntxt(n))} <small class="mu">${new Date(n.ts).toLocaleDateString("ar-EG")}</small></span>${n.from==ME||n.to==ME?`<button onclick="delNote('${n.id}')">حذف</button>`:""}</div>`).join(""):'<div class="mu">لا توجد ملاحظات</div>')}



let COV=false;
function covHtml(t){
 const A=ALLT().filter(x=>x.n!=t.n),rows=[];
 t.d.forEach((ls,i)=>ls.forEach(l=>{
  const fr=A.filter(x=>!x.d[i].some(y=>y.p==l.p)),same=fr.filter(x=>x.dept==DEPT),oth=fr.length-same.length;
  rows.push(`<div class="rw" style="cursor:default"><b>${DAYS[i]} · ح${l.p} <span class="mu">${esc(l.c)}</span></b><span style="text-align:left;flex:1">${same.slice(0,6).map(x=>`<span class="pill">${esc(x.n)}</span>`).join("")||'<span class="mu">لا أحد من القسم</span>'}${same.length>6?'<span class="mu"> +'+(same.length-6)+'</span>':''}<span class="mu"> · من الأقسام التانية: ${oth}</span></span></div>`)}));
 return `<div class="card" style="margin-top:6px"><div class="mu" style="margin-bottom:4px">المعلمون الفاضيون في وقت كل حصة (من نفس القسم أولًا)</div>${rows.join("")||'<div class="mu">مفيش حصص</div>'}</div>`;
}

const homeTab=()=>isTch()?"m":"s";
function togglePV(){
 GS={r:"",d:"",n:"",pin:"",step:0,err:"",own:false};ovHide();
 if(PV){PV=false;ID=IDB;IDB=null;tab="s"}
 else{if(!(ADM||(ID&&ID.role=="o")))return;IDB=ID;ID=null;PV=true;tab="m"}
 LT=null;COV=false;render();
}

function applyData(j){
 DEFS=j.sets;DATAVER=j.ver;
 try{localStorage.setItem("dataj",JSON.stringify(j));localStorage.removeItem("sets")}catch(e){}
 const id=SETS[CUR]?SETS[CUR].id:"";SETS=[...DEFS];const k=SETS.findIndex(x=>x.id==id);useSet(k>=0?k:0);
}
async function loadRemote(manual){
 try{
  const r=await fetch("data.json?_="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;
  const j=await r.json();if(!j||!Array.isArray(j.sets)||!j.sets.every(validSet))throw 0;
  if(String(j.ver)>String(DATAVER)){applyData(j);ME=isTch()?ID.n:null;render();if(manual)msg("تم تحديث الجداول ✓")}
  else if(manual)msg("الجداول محدّثة بالفعل ✓")
 }catch(e){if(manual)msg("التحديث التلقائي غير متاح هنا")}

  const d=[0,1,2,3,4].map(i=>{const seen=new Set(),it=[];String(dd[i]||"").split(/\s+/).forEach(x=>{const m=x.match(/^([1-7]):(.+)$/);if(m&&!seen.has(x)){seen.add(x);it.push({p:+m[1],c:m[2]})}});it.sort((a,b)=>a.p-b.p);return it.map(x=>x.p+":"+x.c).join(" ")});
  const ex=out.find(x=>x.n==n);
  if(ex)ex.d=ex.d.map((v,i)=>[...new Set((v+" "+d[i]).split(/\s+/).filter(Boolean))].sort((a,b)=>parseInt(a)-parseInt(b)).join(" "));else out.push({n,d});
 }
 return out;
}
const XP=`أنت بتقرأ صور جداول حصص مدرسية لمعلمي قسم واحد، وعايز لكل معلم حصصه الأسبوعية.
القواعد:
- الصور ممكن تكون أجزاء من نفس الجدول، فادمجها ومتكررش المعلم.
- أيام الأسبوع بالترتيب: الأحد، الإثنين، الثلاثاء، الأربعاء، الخميس (5 عناصر بالظبط لكل معلم).
- الحصص مرقمة من 1 إلى 7.
- كل حصة تتكتب بالشكل "رقم_الحصة:اسم_الفصل" وبين الحصص مسافة، واسم الفصل يتنقل زي ما هو مكتوب في الصورة بالظبط من غير مسافات جواه (مثال: 11ع/6 أو 10/5 أو 12ع/3).
- لو اليوم مفيهوش حصص للمعلم اكتب نص فاضي "".
- اسم المعلم زي ما هو مكتوب من غير ألقاب مثل أ/.
- ما تخترعش بيانات، ولو حاجة مش واضحة سيبها.
رجّع JSON فقط، بدون أي كلام تاني، بالشكل ده:
{"teachers":[{"n":"اسم المعلم","d":["1:11ع/6 4:12ع/5","5:12ع/7","","1:12ع/7 3:11ع/6","2:12ع/7"]}]}`;
